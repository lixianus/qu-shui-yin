name: Auto Sync and Build Image

on:
  schedule:
    - cron: '0 2 * * *' # 每天凌晨 2 点自动同步
  workflow_dispatch:     # 支持手动随时点击触发

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 允许写入代码
      packages: write    # 允许推送镜像
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 1. 使用原生 Git 配置并拉取原作者代码进行合并
      - name: Sync with Upstream
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加原作者的远程仓库地址
          git remote add upstream https://github.com/wujunwei928/parse-video.git
          git fetch upstream
          
          # 尝试将原作者的 main 分支合并到你当前的 main 分支
          git checkout main || git checkout master
          git merge upstream/main --allow-unrelated-histories --no-edit || git merge upstream/master --allow-unrelated-histories --no-edit || true
          
          # 推送更新后的代码回到你自己的仓库
          git push origin main || git push origin master || true

      # 2. 登录到 GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. 自动编译并打包你自己的独立镜像
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
