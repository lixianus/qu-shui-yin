name: Auto Sync with Original and Build Image

on:
  schedule:
    - cron: '0 2 * * *' # 每天凌晨 2 点自动同步一次原作者代码
  workflow_dispatch:     # 支持手动点击“立即同步并打包”

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      # 1. 拉取你自己的仓库代码 (升级到 v4)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 自动拉取原作者代码并合并
      - name: Sync with Upstream
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "https://github.com/wujunwei928/parse-video.git"
          source_branch: "main"
          destination_branch: "main"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # 3. 登录到 GitHub Container Registry (升级到 v3)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. 自动编译并推送镜像 (升级到 v5)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
