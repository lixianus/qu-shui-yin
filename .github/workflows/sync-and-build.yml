name: Auto Sync with Original and Build Image

on:
  schedule:
    - cron: '0 2 * * *' # 每天凌晨 2 点自动同步一次原作者代码（可按需调整）
  workflow_dispatch:     # 支持你在 GitHub 后台随时手动点一下“立即同步并打包”

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许 GitHub 机器人修改你的仓库代码
    steps:
      # 1. 拉取你自己的仓库代码
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2. 自动拉取原作者 wujunwei928 的最新代码并合并
      - name: Sync with Upstream
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "https://github.com/wujunwei928/parse-video.git"
          source_branch: "main"
          destination_branch: "main"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # 3. 登录并构建你自己的独立镜像 (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. 自动编译并推送到你自己的专属镜像地址
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest